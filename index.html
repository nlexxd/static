<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nlexxd - something happened</title>
	<link rel="icon" type="image/x-icon" href="/static-favicon.ico">
	<style>
		body {
			text-align: center;
		}

		#gif-container {
			max-width: 900px;
		}
		#status {
			display: inline-block;
			padding: 8px 14px;
			size: 17px;
		}

		@keyframes recovered {
			from {
				background: #aaa5a5;
			}
			to {
				background: inherit;
			}
		}

		.recovered {
			animation: recovered 1s infinite;
		}
		a {
			vertical-align: bottom;
		}

		.footer {
			text-align: center;
			position: fixed;
			width: 100%;
			bottom: 0;
			left: 0;
		}
	</style>
</head>
<body>
	<h1>Something happened!</h1>
	<p>You're seeing this because I'm doing something to the website (or i messed something up loll)</p>
	<h2>Current status:</h2>
	<div id="status">Fetching status...</div>
	<h2 id="downtime-title">Current downtime:</h2>
	<p id="downtime"></p>
	<div id="gif-container"></div>
	<div class="footer">
		<a href="https://nlexxd.online">Go to the website</a>
	</div>


	<script>
		function updateTimer(started) {
			const start = new Date(started);

			setInterval(() => {
				const diff = Date.now() - start.getTime();

				const days = Math.floor(diff / 86400000);
				const hours = Math.floor(diff / 3600000) % 24;
				const minutes = Math.floor(diff / 60000) % 60;
				const seconds = Math.floor(diff / 1000) % 60;

				let parts = [];

				if (days > 0) {
					parts.push(`${days}d`);
				}

				if (days > 0 || hours > 0) {
					parts.push(`${hours}h`);
				}

				parts.push(`${minutes}m`);
				parts.push(`${seconds}s`);

				document.getElementById("downtime").textContent =
					parts.join(" ");
			}, 1000);
		}

		function serverBack() {
			let seconds = 5;

			document.body.classList.add("recovered");

			const timer = setInterval(() => {
				document.getElementById("status").textContent =
					`Server is back online! Redirecting in ${seconds}s...`;

				seconds--;

				if (seconds < 0) {
					clearInterval(timer);
					window.location.href = "https://nlexxd.online";
				}
			}, 1000);
		}

		let redirecting = false;

		async function checkServer() {
			if (redirecting) return;

			try {
				const response = await fetch(
					"https://nlexxd.online/health.txt?t=" + Date.now()
				);

				if (response.ok) {
					redirecting = true;
					serverBack();
				}
			} catch (err) {
				console.log("Server still offline");
			}
		}

		setInterval(checkServer, 10000);

		fetch(
			"https://gist.githubusercontent.com/nlexxd/06b4ec9b903e3a531a18d2c3280a9a63/raw/status.json"
		)
			.then(r => r.json())
			.then(data => {
				if (data.isdown) {
					updateTimer(data.downsince);
				} else {
					updateTimer(data.downsince);
					document.getElementById('downtime-title').textContent="Current Uptime:";
				}

				const status = document.getElementById("status");

				status.textContent = data.message;
				status.style.fontFamily = data.font;
				status.style.color = data.textColor;
				status.style.backgroundColor = data.bgColor;

				if (data.gif) {
					const img = document.createElement("img");


					img.src = "./" + data.gif;

					document
						.getElementById("gif-container")
						.appendChild(img);
				}
			})
			.catch(err => {
				console.error(err);

				document.getElementById("status").textContent =
					"There was an error fetching the status...";
			});
	</script>

</body>
</html>
